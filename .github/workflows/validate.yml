name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands: only required for the default HACS store; this repo
          # installs as a custom repository.
          # hacsjson + integration_manifest: false failures while the repo
          # is PRIVATE (the action reads file contents from
          # raw.githubusercontent.com, which 404s unauthenticated; the
          # contents are schema-valid). REMOVE both ignores when the repo
          # goes public at release.
          ignore: brands hacsjson integration_manifest
